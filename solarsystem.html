<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04060d">
<meta name="description" content="Explore the solar system in interactive 3D. Drag to rotate, scroll to zoom, click a planet to learn about it.">
<title>Solar System Explorer | Ansh Patel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#04060d;--panel:rgba(14,20,36,.88);--text:#eef2fa;--muted:#8f9ab0;--accent:#ffb84d;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;color-scheme:dark}
button,a,input{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(12px,3vw,28px);background:rgba(4,6,13,.95);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:17px;text-decoration:none;color:inherit;white-space:nowrap}
.ico{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--accent);color:#2a1700;font-size:20px}
nav,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nl,.btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:8px 13px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);color:#e5e9f2;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.nl:hover,.btn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.nl.home{border-color:rgba(255,184,77,.45);color:var(--accent)}
.app{position:relative;flex:1;min-height:0;display:flex}
#stage{position:relative;flex:1;min-width:0;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.list{position:absolute;left:12px;top:12px;z-index:2;display:flex;flex-direction:column;gap:5px;max-height:calc(100% - 90px);overflow:auto;scrollbar-width:none}
.list button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;text-align:left;backdrop-filter:blur(8px)}
.list button i{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.list button.on{border-color:var(--accent);background:rgba(255,184,77,.16)}
.info{position:absolute;right:12px;top:12px;z-index:2;width:min(300px,calc(100% - 24px));padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(10px)}
.info h2{font-size:22px;letter-spacing:-.5px}
.info .type{color:var(--accent);font-size:12px;font-weight:700;margin-bottom:8px}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin-bottom:10px}
.info dt{color:var(--muted)}.info dd{text-align:right;font-variant-numeric:tabular-nums}
.info p{color:#c6cee0;font-size:12.5px}
.controls{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:14px;padding:8px 16px;border:1px solid var(--line);border-radius:30px;background:var(--panel);backdrop-filter:blur(10px);flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 24px)}
.controls label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.controls output{color:var(--text);min-width:64px;font-variant-numeric:tabular-nums}
.controls input[type=range]{width:110px;accent-color:var(--accent)}
.controls input[type=checkbox]{accent-color:var(--accent)}
.zoom{padding:4px 11px;min-height:30px}
.tag{position:absolute;z-index:1;transform:translate(-50%,-150%);font-size:11px;color:#cdd6ea;text-shadow:0 0 4px #000;pointer-events:none;white-space:nowrap}
#loadErr{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:var(--muted)}
@media(max-width:700px){.list{flex-direction:row;right:12px;max-height:none;overflow-x:auto;padding-bottom:4px}.list button{flex:0 0 auto}.info{top:56px;width:calc(100% - 24px);max-height:42%;overflow:auto}.controls{gap:8px;padding:8px 12px}.controls input[type=range]{width:80px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" aria-label="Ansh Patel home"><span class="ico" aria-hidden="true">🪐</span><span>Solar System Explorer</span></a>
  <nav aria-label="Main navigation">
    <a class="nl" href="widgets.html">← Back to Widgets</a>
    <a class="nl home" href="index.html">⌂ Home</a>
  </nav>
</header>
<main class="app">
  <div id="stage" aria-label="3D solar system. Drag to rotate, scroll to zoom.">
    <div id="loadErr">Couldn't load the 3D engine. Check your connection and reload the page.</div>
  </div>
  <div class="list" id="list" role="group" aria-label="Choose a planet"></div>
  <section class="info" id="info" aria-live="polite"></section>
  <div class="controls">
    <label for="speed">Time <input id="speed" type="range" min="0" max="200" step="1" value="30"><output id="speedO"></output></label>
    <label><input id="orbitsChk" type="checkbox" checked> Orbits</label>
    <label><input id="labelsChk" type="checkbox" checked> Labels</label>
    <button class="btn zoom" id="zin" type="button" aria-label="Zoom in">＋</button>
    <button class="btn zoom" id="zout" type="button" aria-label="Zoom out">−</button>
  </div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  if (!window.THREE) { $("loadErr").style.display = "grid"; return; }

  // r = visual radius, d = orbit distance (not to scale), p = orbital period in days
  const BODIES = [
    { n: "Sun", r: 5, d: 0, p: 0, c: "#ffb627", type: "Star", dia: "1,391,000 km", dist: "—", year: "—", day: "25–35 Earth days", moons: "—", fact: "Holds 99.86% of the solar system's mass. Every second it turns about 4 million tonnes of matter into energy." },
    { n: "Mercury", r: .55, d: 9, p: 88, c: "#a39a92", type: "Rocky planet", dia: "4,879 km", dist: "57.9 million km", year: "88 days", day: "59 Earth days", moons: "0", fact: "The smallest planet and the fastest. Temperatures swing from 430°C by day to −180°C at night." },
    { n: "Venus", r: .95, d: 13, p: 225, c: "#e3bb76", type: "Rocky planet", dia: "12,104 km", dist: "108 million km", year: "225 days", day: "243 Earth days", moons: "0", fact: "Hotter than Mercury thanks to a runaway greenhouse effect. It spins backwards, so the Sun rises in the west." },
    { n: "Earth", r: 1, d: 18, p: 365, c: "#3b78d8", type: "Rocky planet", dia: "12,742 km", dist: "149.6 million km", year: "365.25 days", day: "24 hours", moons: "1", fact: "The only known world with life. About 71% of its surface is covered in liquid water." },
    { n: "Mars", r: .75, d: 23, p: 687, c: "#c8563a", type: "Rocky planet", dia: "6,779 km", dist: "228 million km", year: "687 days", day: "24 h 37 min", moons: "2", fact: "Home to Olympus Mons, the tallest volcano known in the solar system, at about 22 km high." },
    { n: "Jupiter", r: 2.7, d: 32, p: 4333, c: "#d3a77c", type: "Gas giant", dia: "139,820 km", dist: "778 million km", year: "11.9 years", day: "9 h 56 min", moons: "95", fact: "More than twice as massive as all other planets combined. The Great Red Spot is a storm older than 150 years." },
    { n: "Saturn", r: 2.3, d: 42, p: 10759, c: "#e0c98d", type: "Gas giant", dia: "116,460 km", dist: "1.43 billion km", year: "29.5 years", day: "10 h 33 min", moons: "146", fact: "Its rings span up to 282,000 km yet are often only about 10 metres thick. It is less dense than water." },
    { n: "Uranus", r: 1.5, d: 51, p: 30687, c: "#8fd8e0", type: "Ice giant", dia: "50,724 km", dist: "2.87 billion km", year: "84 years", day: "17 h 14 min", moons: "28", fact: "Tipped on its side at 98°, so each pole gets 42 years of continuous sunlight, then 42 years of darkness." },
    { n: "Neptune", r: 1.45, d: 59, p: 60190, c: "#4b6fe0", type: "Ice giant", dia: "49,244 km", dist: "4.50 billion km", year: "165 years", day: "16 h 6 min", moons: "16", fact: "Winds reach over 2,000 km/h, the fastest in the solar system. It was found by maths before it was seen." }
  ];

  const stage = $("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.22));
  const sunLight = new THREE.PointLight(0xffffff, 1.7, 0, 0); scene.add(sunLight);

  // Stars
  const sp = new Float32Array(2400 * 3);
  for (let i = 0; i < 2400; i++) {
    const v = new THREE.Vector3().randomDirection ? new THREE.Vector3().randomDirection() : new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
    v.multiplyScalar(500 + Math.random() * 300); sp.set([v.x, v.y, v.z], i * 3);
  }
  const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 1.3, sizeAttenuation: false })));

  function texture(b) {
    const c = document.createElement("canvas"); c.width = 256; c.height = 128; const x = c.getContext("2d");
    x.fillStyle = b.c; x.fillRect(0, 0, 256, 128);
    const gas = ["Jupiter", "Saturn", "Uranus", "Neptune"].includes(b.n);
    if (gas) for (let y = 0; y < 128; y += 4 + Math.random() * 8) { x.fillStyle = `rgba(${Math.random() < .5 ? "255,255,255" : "40,20,0"},${Math.random() * .2})`; x.fillRect(0, y, 256, 3 + Math.random() * 9); }
    else if (b.n === "Earth") { for (let i = 0; i < 26; i++) { x.fillStyle = `rgba(${60 + Math.random() * 40},${120 + Math.random() * 60},70,.9)`; x.beginPath(); x.ellipse(Math.random() * 256, 20 + Math.random() * 90, 6 + Math.random() * 22, 4 + Math.random() * 12, Math.random() * 3, 0, 7); x.fill(); } x.fillStyle = "rgba(255,255,255,.85)"; x.fillRect(0, 0, 256, 7); x.fillRect(0, 121, 256, 7); }
    else for (let i = 0; i < 90; i++) { x.fillStyle = `rgba(${Math.random() < .5 ? "0,0,0" : "255,255,255"},${Math.random() * .16})`; x.beginPath(); x.arc(Math.random() * 256, Math.random() * 128, 2 + Math.random() * 9, 0, 7); x.fill(); }
    return new THREE.CanvasTexture(c);
  }

  const meshes = [], labels = [];
  BODIES.forEach((b, i) => {
    const geo = new THREE.SphereGeometry(b.r, 48, 32);
    const mat = i === 0 ? new THREE.MeshBasicMaterial({ color: 0xffc94a }) : new THREE.MeshStandardMaterial({ map: texture(b), roughness: .9, metalness: 0 });
    const mesh = new THREE.Mesh(geo, mat); b.mesh = mesh; b.angle = Math.random() * 6.28; b.spin = i ? (1 + i * .3) : .1; meshes.push(mesh);
    const group = new THREE.Group(); group.add(mesh); b.group = group; scene.add(group);
    if (i === 0) { const glow = new THREE.Mesh(new THREE.SphereGeometry(b.r * 1.25, 32, 24), new THREE.MeshBasicMaterial({ color: 0xff9a1f, transparent: true, opacity: .22 })); group.add(glow); }
    if (i) {
      const pts = []; for (let k = 0; k < 160; k++) { const a = k / 160 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * b.d, 0, Math.sin(a) * b.d)); }
      b.orbit = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x3a4766, transparent: true, opacity: .8 })); scene.add(b.orbit);
    }
    if (b.n === "Saturn") {
      const ring = new THREE.Mesh(new THREE.RingGeometry(b.r * 1.3, b.r * 2.2, 80), new THREE.MeshBasicMaterial({ color: 0xcdbb90, side: THREE.DoubleSide, transparent: true, opacity: .75 }));
      ring.rotation.x = Math.PI / 2 - .45; group.add(ring); mesh.rotation.z = .45;
    }
    if (b.n === "Uranus") mesh.rotation.z = 1.7;
    if (b.n === "Earth") { b.moon = new THREE.Mesh(new THREE.SphereGeometry(.27, 24, 16), new THREE.MeshStandardMaterial({ color: 0xbbbbbb, roughness: 1 })); group.add(b.moon); }
    const t = document.createElement("div"); t.className = "tag"; t.textContent = b.n; stage.appendChild(t); labels.push(t);
  });

  // Camera orbit state
  let theta = .6, phi = 1.15, dist = 85, distT = 85, selected = null;
  const target = new THREE.Vector3(), targetGoal = new THREE.Vector3();

  function select(i) {
    selected = i;
    document.querySelectorAll(".list button").forEach((b, k) => b.classList.toggle("on", k === i));
    const b = BODIES[i], el = $("info");
    el.innerHTML = `<h2>${b.n}</h2><div class="type">${b.type}</div><dl>
      <dt>Diameter</dt><dd>${b.dia}</dd><dt>From the Sun</dt><dd>${b.dist}</dd><dt>Year</dt><dd>${b.year}</dd><dt>Day</dt><dd>${b.day}</dd><dt>Moons</dt><dd>${b.moons}</dd></dl><p>${b.fact}</p>`;
    distT = Math.max(b.r * 5, 6);
  }
  function overview() { selected = null; distT = 85; document.querySelectorAll(".list button").forEach(b => b.classList.remove("on")); $("info").innerHTML = "<h2>Solar System</h2><div class='type'>Not to scale</div><p>Drag to rotate, scroll or pinch buttons to zoom, and click a planet to fly to it. Distances and sizes are compressed so everything fits on screen.</p><div class='row' style='margin-top:10px'><button class='btn' id='ov' type='button'>Reset view</button></div>"; const ov = $("ov"); if (ov) ov.addEventListener("click", overview); }

  const list = $("list");
  BODIES.forEach((b, i) => {
    const btn = document.createElement("button"); btn.type = "button"; btn.innerHTML = `<i style="background:${b.c}"></i>${b.n}`;
    btn.addEventListener("click", () => select(i)); list.appendChild(btn);
  });

  // Input
  let down = null, moved = 0;
  stage.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; moved = 0; stage.classList.add("drag"); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y; moved += Math.abs(dx) + Math.abs(dy);
    theta -= dx * .006; phi = Math.min(2.9, Math.max(.2, phi - dy * .006)); down = { x: e.clientX, y: e.clientY };
  });
  stage.addEventListener("pointerup", e => {
    stage.classList.remove("drag");
    if (down && moved < 6) pick(e);
    down = null;
  });
  stage.addEventListener("wheel", e => { e.preventDefault(); distT = Math.min(300, Math.max(2.5, distT * (1 + Math.sign(e.deltaY) * .12))); }, { passive: false });
  $("zin").addEventListener("click", () => { distT = Math.max(2.5, distT * .75); });
  $("zout").addEventListener("click", () => { distT = Math.min(300, distT * 1.33); });

  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  function pick(e) {
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObjects(meshes)[0];
    if (hit) select(meshes.indexOf(hit.object));
  }

  const speed = $("speed");
  const showSpeed = () => { $("speedO").textContent = speed.value == 0 ? "Paused" : speed.value + " days/s"; };
  speed.addEventListener("input", showSpeed); showSpeed();
  $("orbitsChk").addEventListener("change", e => BODIES.forEach(b => { if (b.orbit) b.orbit.visible = e.target.checked; }));
  $("labelsChk").addEventListener("change", e => labels.forEach(l => { l.style.display = e.target.checked ? "" : "none"; }));

  function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(stage); resize();

  const clock = new THREE.Clock(), v = new THREE.Vector3();
  function loop() {
    const dt = Math.min(clock.getDelta(), .05), days = +speed.value * dt;
    BODIES.forEach((b, i) => {
      if (i) { b.angle += (Math.PI * 2 / b.p) * days; b.group.position.set(Math.cos(b.angle) * b.d, 0, Math.sin(b.angle) * b.d); }
      b.mesh.rotation.y += b.spin * dt * (.4 + speed.value / 60);
      if (b.moon) { const a = b.angle * 13; b.moon.position.set(Math.cos(a) * 2, 0, Math.sin(a) * 2); }
    });
    if (selected !== null) targetGoal.copy(BODIES[selected].group.position); else targetGoal.set(0, 0, 0);
    target.lerp(targetGoal, .08); dist += (distT - dist) * .08;
    camera.position.set(target.x + dist * Math.sin(phi) * Math.sin(theta), target.y + dist * Math.cos(phi), target.z + dist * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(target);
    const w = stage.clientWidth, h = stage.clientHeight;
    BODIES.forEach((b, i) => {
      v.copy(b.group.position).project(camera); const l = labels[i];
      const vis = v.z < 1; l.style.left = (v.x * .5 + .5) * w + "px"; l.style.top = (-v.y * .5 + .5) * h + "px"; l.style.visibility = vis ? "visible" : "hidden";
    });
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  overview(); loop();
})();
</script>
</body>
</html>
