<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frog Numbers - Ansh Patel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    .frog-display {
      text-align: center;
      padding: 2rem;
    }

    .current-time {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary, #4facfe);
      margin-bottom: 2rem;
    }

    .frog-info {
      display: flex;
      justify-content: space-around;
      gap: 2rem;
      margin: 2rem 0;
      flex-wrap: wrap;
    }

    .frog-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1.5rem;
      border-radius: 15px;
      flex: 1;
      min-width: 200px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .frog-card h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1rem;
      opacity: 0.9;
    }

    .frog-card .number {
      font-size: 3rem;
      font-weight: bold;
      margin: 0;
    }

    .view-all-btn {
      background: var(--primary, #4facfe);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 2rem;
      transition: all 0.2s ease;
    }

    .view-all-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
    }

    .all-frogs {
      display: none;
      margin-top: 2rem;
      padding: 2rem;
      background: #f5f5f5;
      border-radius: 15px;
    }

    .all-frogs.show {
      display: block;
    }

    .all-frogs h3 {
      margin-top: 0;
      color: var(--primary, #4facfe);
    }

    .frog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .frog-number {
      background: white;
      padding: 1rem;
      border-radius: 10px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary, #4facfe);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .frog-number:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      animation: fadeIn 0.3s;
    }

    .modal.show {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 15px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      animation: slideIn 0.3s;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-header h2 {
      margin: 0;
      color: var(--primary, #4facfe);
      font-size: 2rem;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      color: #999;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #333;
    }

    .modal-body {
      color: #666;
      line-height: 1.6;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideIn {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .emoji {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header class="game-header">
    <div class="game-header-content">
      <h1>🐸 Frog Numbers</h1>
      <div class="header-links">
        <a href="widgets.html" class="back-link">← Back to Widgets</a>
        <a href="index.html" class="back-link">🏠 Home</a>
      </div>
    </div>
  </header>

  <main class="game-container">
    <div class="game-card">
      <div class="frog-display">
        <div class="emoji">🐸</div>
        <div class="current-time" id="currentMinute">--</div>
        
        <div class="frog-info">
          <div class="frog-card">
            <h3>Just Missed</h3>
            <p class="number" id="lastFrog">--</p>
          </div>
          <div class="frog-card">
            <h3>Next Frog</h3>
            <p class="number" id="nextFrog">--</p>
          </div>
        </div>

        <button class="view-all-btn" onclick="toggleAllFrogs()">View All Frog Numbers</button>

        <div class="all-frogs" id="allFrogs">
          <h3>All Frog Numbers (Minutes)</h3>
          <div class="frog-grid" id="frogGrid"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal for frog number description -->
  <div id="frogModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🐸 Frog Number <span id="modalFrogNumber"></span></h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modalDescription">Description coming soon...</p>
      </div>
    </div>
  </div>

  <script>
    const frogNumbers = [1, 3, 7, 9, 14, 18, 22, 25, 29, 31, 33, 37, 40, 44, 46, 49, 51, 52, 55, 58];
    
    // Descriptions for each frog number - add your descriptions here
    const frogDescriptions = {
      1: "Description for frog number 1",
      3: "Description for frog number 3",
      7: "Description for frog number 7",
      9: "Description for frog number 9",
      14: "Description for frog number 14",
      18: "Description for frog number 18",
      22: "Description for frog number 22",
      25: "Description for frog number 25",
      29: "Description for frog number 29",
      31: "Description for frog number 31",
      33: "Description for frog number 33",
      37: "Description for frog number 37",
      40: "Description for frog number 40",
      44: "Description for frog number 44",
      46: "Description for frog number 46",
      49: "Description for frog number 49",
      51: "Description for frog number 51",
      52: "Description for frog number 52",
      55: "Description for frog number 55",
      58: "Description for frog number 58"
    };

    function updateFrogInfo() {
      const now = new Date();
      const currentMinute = now.getMinutes();
      
      document.getElementById('currentMinute').textContent = `Current Minute: ${currentMinute}`;

      // Find last frog (just missed)
      let lastFrog = null;
      for (let i = frogNumbers.length - 1; i >= 0; i--) {
        if (frogNumbers[i] < currentMinute) {
          lastFrog = frogNumbers[i];
          break;
        }
      }
      // If no frog before current minute, wrap around to last frog of previous hour
      if (lastFrog === null) {
        lastFrog = frogNumbers[frogNumbers.length - 1];
      }

      // Find next frog
      let nextFrog = null;
      for (let i = 0; i < frogNumbers.length; i++) {
        if (frogNumbers[i] > currentMinute) {
          nextFrog = frogNumbers[i];
          break;
        }
      }
      // If no frog after current minute, wrap around to first frog of next hour
      if (nextFrog === null) {
        nextFrog = frogNumbers[0];
      }

      document.getElementById('lastFrog').textContent = lastFrog;
      document.getElementById('nextFrog').textContent = nextFrog;
    }

    function toggleAllFrogs() {
      const allFrogsDiv = document.getElementById('allFrogs');
      allFrogsDiv.classList.toggle('show');
    }

    function openModal(frogNumber) {
      const modal = document.getElementById('frogModal');
      document.getElementById('modalFrogNumber').textContent = frogNumber;
      document.getElementById('modalDescription').textContent = frogDescriptions[frogNumber];
      modal.classList.add('show');
    }

    function closeModal() {
      const modal = document.getElementById('frogModal');
      modal.classList.remove('show');
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('frogModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    function populateFrogGrid() {
      const grid = document.getElementById('frogGrid');
      frogNumbers.forEach(num => {
        const div = document.createElement('div');
        div.className = 'frog-number';
        div.textContent = num;
        div.onclick = () => openModal(num);
        grid.appendChild(div);
      });
    }

    // Initialize
    updateFrogInfo();
    populateFrogGrid();
    
    // Update every second
    setInterval(updateFrogInfo, 1000);

    // Header auto-hide on scroll
    let lastScrollTop = 0;
    const header = document.querySelector('.game-header');
    
    window.addEventListener('scroll', function() {
      let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      
      if (scrollTop > lastScrollTop && scrollTop > 100) {
        // Scrolling down & past 100px
        header.style.transform = 'translateY(-100%)';
      } else {
        // Scrolling up
        header.style.transform = 'translateY(0)';
      }
      
      lastScrollTop = scrollTop;
    });
  </script>

</body>
</html>
